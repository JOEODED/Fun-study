<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun Study — Timer</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/courses.css">
  <link rel="stylesheet" href="css/timer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">FS</div>
      <span class="app-name">Fun Study</span>
    </div>
    <div class="topbar-right">
      <span id="userEmail" class="user-email"></span>
      <div class="avatar"></div>
      <button id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="body-layout">
    <aside class="sidebar">
      <nav>
        <a href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </a>
        <a href="courses.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Courses
        </a>
        <a href="assignments.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Assignments
        </a>
        <a href="tasks.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Study Tasks
        </a>
        <a href="grades.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Grades
        </a>
        <a href="timer.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Timer
        </a>
              <a href="stats.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>
          Statistics
        </a>
</nav>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Study Timer</h1>
          <p class="page-sub">Pomodoro-style focus sessions.</p>
        </div>
      </div>

      <div class="timer-wrap">
        <div class="timer-card" id="timerCard">
          <span class="timer-badge" id="timerBadge">Study Session</span>

          <div class="ring-wrap">
            <svg viewBox="0 0 220 220" class="timer-ring">
              <circle cx="110" cy="110" r="98" class="ring-track"/>
              <circle cx="110" cy="110" r="98" class="ring-progress" id="ringProgress"/>
            </svg>
            <div class="ring-center">
              <span class="timer-display" id="timerDisplay">25:00</span>
              <span class="timer-sub" id="timerSub">Ready when you are</span>
            </div>
          </div>

          <div class="field course-field">
            <label for="courseSelect">Course (optional)</label>
            <select id="courseSelect">
              <option value="">No specific course</option>
            </select>
          </div>

          <div class="timer-controls">
            <button id="resetBtn" class="ghost-btn icon-btn" title="Reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button id="startBtn" class="primary-btn timer-main-btn">Start</button>
            <button id="pauseBtn" class="ghost-btn icon-btn" title="Pause" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
          </div>
        </div>

        <div class="timer-stats">
          <div class="stat-card">
            <p class="stat-label">Sessions Completed Today</p>
            <p class="stat-value" id="sessionsToday">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">Total Study Minutes</p>
            <p class="stat-value" id="totalMinutes">–</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/timer.js"></script>
</body>
</html>
