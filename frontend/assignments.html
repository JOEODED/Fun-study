<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun Study — Assignments</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/courses.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">FS</div>
      <span class="app-name">Fun Study</span>
    </div>
    <div class="topbar-right">
      <span id="userEmail" class="user-email"></span>
      <div class="avatar"></div>
      <button id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="body-layout">
    <aside class="sidebar">
      <nav>
        <a href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </a>
        <a href="courses.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Courses
        </a>
        <a href="assignments.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Assignments
        </a>
        <a href="tasks.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Study Tasks
        </a>
        <a href="grades.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Grades
        </a>
        <a href="timer.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Timer
        </a>
              <a href="stats.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>
          Statistics
        </a>
</nav>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Assignments</h1>
          <p class="page-sub">Everything due across your courses.</p>
        </div>
        <button id="addAssignmentBtn" class="primary-btn">+ Add Assignment</button>
      </div>

      <div class="filter-row">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="PENDING">Pending</option>
          <option value="COMPLETED">Completed</option>
        </select>
      </div>

      <div class="table-wrap">
        <table id="assignmentsTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Course</th>
              <th>Deadline</th>
              <th>Priority</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="assignmentsBody">
            <tr><td colspan="6" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="assignmentModal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">Add Assignment</h2>
      <form id="assignmentForm">
        <input type="hidden" id="assignmentId">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Assignment 2 — Linked Lists" required>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Implement a doubly linked list">
        </div>
        <div class="field">
          <label for="courseSelect">Course</label>
          <select id="courseSelect" required>
            <option value="">Select a course...</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="deadline">Deadline</label>
            <input type="date" id="deadline">
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="PENDING" selected>Pending</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/assignments.js"></script>
</body>
</html>
